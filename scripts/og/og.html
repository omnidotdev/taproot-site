<!doctype html>
<!--
  Taproot OG card (1200x630). Self-contained and regenerable.
  Regenerate public/og.png from this directory:
    chromium --headless=new --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=og-2x.png "file://$PWD/og.html"
    magick og-2x.png -resize 1200x630 -strip ../../public/og.png
  mark.svg is the Taproot root mark; the Omni credit mark is inlined below.
  Fonts: Inter + JetBrains Mono (Google Fonts).
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #0b0b0e;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center;
  }
  .ember {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(120% 92% at 50% 130%, rgba(249,135,58,0.62) 0%, rgba(226,59,46,0.32) 26%, rgba(226,59,46,0.0) 56%),
      radial-gradient(80% 60% at 18% 8%, rgba(249,135,58,0.10) 0%, rgba(249,135,58,0) 60%);
  }
  .code {
    position: absolute; inset: 0; z-index: 1;
    padding: 54px 64px;
    font-family: 'JetBrains Mono', monospace; font-size: 23px; line-height: 2.0;
    font-weight: 500; white-space: pre; letter-spacing: 0.5px;
    color: transparent;
    background-image: linear-gradient(
      179deg,
      rgba(176,88,56,0.66) 0%,
      rgba(226,100,52,0.80) 40%,
      rgba(250,146,70,0.95) 74%,
      rgba(255,204,136,1) 100%);
    -webkit-background-clip: text; background-clip: text;
    text-shadow: 0 0 20px rgba(249,120,40,0.4);
    -webkit-mask-image:
      linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.78) 55%, #000 100%),
      radial-gradient(52% 70% at 18% 66%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 48%, #000 78%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.78) 55%, #000 100%),
      radial-gradient(52% 70% at 18% 66%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 48%, #000 78%);
    mask-composite: intersect;
  }
  .scrim { position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(44% 60% at 16% 52%, rgba(11,11,14,0.9) 0%, rgba(11,11,14,0.5) 40%, rgba(11,11,14,0) 70%),
      radial-gradient(66% 84% at 55% 54%, rgba(11,11,14,0.97) 0%, rgba(11,11,14,0.8) 46%, rgba(11,11,14,0) 80%); }
  .grain { position:absolute; inset:0; z-index:2;
    background: radial-gradient(60% 100% at 50% 100%, transparent 58%, rgba(0,0,0,0.38) 100%); }
  .content { position: relative; z-index: 3; display: flex; align-items: center; gap: 56px;
    padding: 0 96px; width: 100%; }
  .mark { flex: 0 0 auto; width: auto; height: 268px;
    filter: drop-shadow(0 20px 60px rgba(242,100,25,0.55)); }
  .text { display: flex; flex-direction: column; gap: 14px; }
  .word { font-size: 148px; font-weight: 900; letter-spacing: -5px; line-height: 0.9;
    color: #fbfbf9;
    background: linear-gradient(180deg,#ffffff 30%,#ffd9b8 130%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tag { font-size: 40px; font-weight: 500; letter-spacing: -0.5px; color: #f9873a; }
  .foot { position: absolute; z-index: 4; left: 96px; bottom: 42px;
    display: flex; align-items: center; gap: 18px; }
  .url { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 500;
    color: #9a9aa2; letter-spacing: 0.3px; }
  .by { display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 500;
    color: #6a6a72; letter-spacing: 0.2px; }
  .by .omni { width: 24px; height: 24px; display: block; opacity: 0.92; }
  .by .omni svg { width: 100%; height: 100%; display: block; }
  .by b { color: #f9873a; font-weight: 700; }
  .pill { position:absolute; z-index:4; right: 64px; bottom: 44px;
    font-family:'JetBrains Mono',monospace; font-size: 20px; color:#c9c9d1;
    border:1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03);
    padding: 10px 18px; border-radius: 999px; }
  .pill b { color:#f9873a; }
</style>
</head>
<body>
  <div class="card">
    <div class="ember"></div>
    <div class="code">$ taproot --database-url $DATABASE_URL

  introspecting schema public ...
  42 tables · 118 relations · 9 enums
  GraphQL ready → :4000/graphql

{ user(id: 7) { name posts { title } } }</div>
    <div class="scrim"></div>
    <div class="grain"></div>

    <div class="content">
      <img class="mark" src="mark.svg" alt="Taproot" />
      <div class="text">
        <div class="word">Taproot</div>
        <div class="tag">The most direct path from Postgres to GraphQL</div>
      </div>
    </div>

    <div class="foot">
      <div class="url">taproot.omni.dev</div>
      <div class="by">by
        <span class="omni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="#f9873a">
          <path d="m305.55,251.06c-2.25,39.89-22.63,78.45-54.97,102.2-.02,0-.03.02-.05.03-35.35,24.87-81.6,30.43-121.78,16.38-.35-.12-.7-.25-1.04-.37-26.04-9.8-49.08-27.59-64.36-51.03-.35-.54-.7-1.07-1.03-1.61-.36-.56-.7-1.12-1.04-1.68-.84-1.36-1.63-2.74-2.4-4.14-.38-.69-.78-1.4-1.15-2.11,99.71,81.94,249.46-2.53,229.47-130.45,14.13,22.6,19.75,47.95,18.34,72.79Z"/>
          <path d="m350.16,291.36c-13.92,38.42-46.39,68.99-85.59,80.61-13.5,4.1-27.59,5.99-41.62,5.63,120.83-45.38,122.54-217.31,1.77-263.96,90.07-3.14,158.73,93.67,125.44,177.72Z"/>
          <path d="m262.5,264.7c-9.91,16.9-21.83,30.36-35.02,40.65-.02,0-.03.02-.04.02-26.31,19.55-59.7,28.4-92.15,25.76-33.37-3.58-65.28-19.48-87.77-44.61-.03-.02-.05-.05-.08-.09-.53-.65-1.06-1.3-1.59-1.96-18.67-22.2-29.25-50.51-30.41-79.28-.29-11.18.77-22.92,3.39-35.14,3.2-13.74,8.61-26.88,15.94-38.84-21.52,126.87,127.51,214.92,227.72,133.49Z"/>
          <path d="m175.28,286.51c-24.18-.77-45.05-6.12-62.62-14.81-29.99-16.17-53.17-44.03-64.23-76.15,0,0,0-.02,0-.02-9.94-32.31-7.74-68.25,6.53-98.97,13.75-28.49,38.28-51.08,67.17-63.51,0,0,.02,0,.03-.02,15.92-6.35,34.22-10.1,54.9-10.48-120.82,45.36-122.54,217.31-1.77,263.95Z"/>
          <path d="m342.25,91.43c-99.69-81.94-249.46,2.54-229.47,130.46-31.13-49.86-20.92-113.06,14.77-154.66.63-.73,1.26-1.45,1.89-2.16,18.88-21.08,44.46-36.24,74.56-40.69,54.31-10.05,112.48,18.21,138.25,67.05Z"/>
          <path d="m381.15,230.1h0c-3.19,13.74-8.6,26.89-15.94,38.84,21.54-126.89-127.52-214.91-227.71-133.49C214.51,4.1,413.07,81.17,381.15,230.1Z"/>
        </svg></span>
        <b>Omni</b>
      </div>
    </div>
    <div class="pill">$ <b>taproot</b> serve</div>
  </div>
</body>
</html>
